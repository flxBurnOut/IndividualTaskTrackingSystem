[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-management"
version = "0.11.2"
description = "Local-first personal management with native desktop and Codex entrances"
requires-python = ">=3.12"
dependencies = ["PySide6==6.11.2", "Pillow==12.3.0", "mcp==2.2.0", "psutil==7.2.2", "tzdata==2026.4", "python-docx==1.2.0", "reportlab==5.0.1", "pypdf==6.19.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pyinstaller==6.22.3"]

[project.scripts]
personal-management = "management.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.setuptools.package-data]
management = ["builtin_skills/**/*.md", "assets/*.ico", "assets/*.png", "assets/*.svg"]
